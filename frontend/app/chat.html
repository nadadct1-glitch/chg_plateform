<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discussion CHG</title>
<meta name="theme-color" content="#1E2138">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/pwa.js" defer></script>
</head>
<body class="theme-light">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page-content" style="display:flex; flex-direction:column; min-height:calc(100vh - var(--topbar-h));">

      <div class="page-head" style="margin-bottom:.8rem;">
        <div>
          <h1>Discussion</h1>
          <p class="lead">Échangez en temps réel avec les autres membres du conglomérat.</p>
        </div>
      </div>

      <div class="tabs mb-2" id="channel-tabs"></div>

      <div id="messages" style="flex:1; overflow-y:auto; padding:.4rem .2rem 1rem;"></div>

      <form id="chat-form" class="chat-input-bar">
        <input class="input" id="chat-input" placeholder="Écrire un message..." autocomplete="off" style="border:none; background:transparent;">
        <button type="submit" class="btn btn-primary btn-sm">Envoyer</button>
      </form>

    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
