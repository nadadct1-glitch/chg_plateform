<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finances Admin CHG</title>
<meta name="theme-color" content="#F2F3F8">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/pwa.js" defer></script>

<body class="theme-light">
<div class="app-shell">

    <main class="content" id="page-content">

      <div class="page-head">
        <div>
          <h1>Finances</h1>
          <p class="lead">Dépenses et entrées financières du conglomérat.</p>
        </div>
      </div>

      <div class="finance-summary-row" id="finance-summary"><div class="loader"><div class="spinner"></div></div></div>

      <div class="tabs mb-2" id="finance-tabs"></div>

      <div class="card mb-2" id="finance-form-card"></div>

      <div class="section-label" style="margin-top:0;" id="finance-list-label">Historique</div>
      <div id="finance-panel"></div>

    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
